[package]
name = "zapp-ble"
version = "0.1.0"
edition = "2021"
description = "BLE discovery for ZSA keyboards"

[dependencies]
# SMP payloads are CBOR. Value-level, so a byte string stays a byte string
# rather than becoming an array of integers the way a derived Serialize would.
ciborium = "0.2"
log = "0.4"
# The image upload announces a SHA-256 of the image in its first request.
sha2 = "0.10"
thiserror = "2"
zapp-core = { path = "../zapp-core" }

[dev-dependencies]
# The watch example turns RUST_LOG on, which is how the backends are diagnosed
# on a machine where a board is not showing up.
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
# Pure Rust D-Bus, so BlueZ costs no system library at build time. The blocking
# API keeps the crate free of an async runtime.
zbus = "5"
