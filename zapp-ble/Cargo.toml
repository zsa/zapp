[package]
name = "zapp-ble"
version = "0.1.0"
edition = "2021"
description = "BLE discovery for ZSA keyboards"

[dependencies]
log = "0.4"
thiserror = "2"
zapp-core = { path = "../zapp-core" }
zapp-smp = { path = "../zapp-smp" }

[dev-dependencies]
# The mtu_probe example builds its own CBOR echo payloads.
ciborium = "0.2"
# The watch example turns RUST_LOG on, which is how the backends are diagnosed
# on a machine where a board is not showing up.
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
# Pure Rust D-Bus, so BlueZ costs no system library at build time. The blocking
# API keeps the crate free of an async runtime.
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# CoreBluetooth through objc2's generated bindings. The central runs on a
# dispatch queue of its own, so nothing here needs a run loop or an async
# runtime: the delegate hands each callback to a blocking caller.
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-bluetooth = "0.3"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSString", "NSUUID", "NSValue"] }
