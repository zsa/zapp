[package]
name = "zapp-update"
version = "0.1.0"
edition = "2024"
description = "Updating a Wireless Voyager's firmware, over Bluetooth or the cable, without a terminal"

[dependencies]
# The orchestration builds its failures the way the CLI always has, as context
# chains, and the public error is rendered from them.
anyhow = "1"
log = "0.4"
# Releases on CrabNebula Cloud (`cloud`).
base64 = "0.22"
minisign-verify = "0.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zapp-ble = { path = "../zapp-ble" }
zapp-core = { path = "../zapp-core" }
zapp-smp = { path = "../zapp-smp" }
zapp-wired = { path = "../zapp-wired" }

[dev-dependencies]
# The wired orchestration is tested against the in-memory keyboard rather than
# against a board, which needs the loopback stack compiled into the library.
zapp-wired = { path = "../zapp-wired", features = ["loopback"] }
# The Bluetooth orchestration is tested against in-memory halves.
zapp-smp = { path = "../zapp-smp", features = ["test-double"] }
