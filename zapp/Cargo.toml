[package]
name = "zapp"
version = "1.1.11"
edition = "2024"

[dependencies]
zapp-ble = { path = "../zapp-ble" }
zapp-core = { path = "../zapp-core" }
zapp-oryx = { path = "../zapp-oryx" }
zapp-smp = { path = "../zapp-smp" }
zapp-update = { path = "../zapp-update" }
zapp-wired = { path = "../zapp-wired" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
env_logger = "0.11"
indicatif = "0.17"
log = "0.4"
base64 = "0.22"
flate2 = "1"
minisign-verify = "0.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls"] }
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
# The wired orchestration is tested against the in-memory keyboard rather than
# against a board, which needs the loopback stack compiled into the library.
zapp-wired = { path = "../zapp-wired", features = ["loopback"] }
